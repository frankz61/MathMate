<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>宠物画廊 · petSVG 参数速览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 32px; background: #171a26; color: #e8eaf2;
         font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #8b93ad; margin: 0 0 20px; }
  h2 { font-size: 14px; color: #aab3cc; margin: 22px 0 10px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .card { width: 128px; background: #1f2333; border: 1px solid #2c3145;
          border-radius: 12px; padding: 10px 8px 6px; text-align: center; }
  .card svg { width: 104px; height: 104px; }
  .card .cap { font-size: 11px; color: #8b93ad; margin-top: 2px; }
  .big .card { width: 172px; } .big .card svg { width: 148px; height: 148px; }
</style>
</head>
<body>
<h1>宠物画廊</h1>
<p class="sub">petSVG(species, hue, { idle, cheer, level, alive }) —— 开发调参用,随 /shared/pet.js 自动更新</p>
<div id="app"></div>
<script type="module">
import { petSVG, SPECIES, SPECIES_ZH } from "./pet.js";

const HUES = [200, 45, 28, 175, 260, 150, 8, 220, 330, 45, 190, 285];
const hueOf = (i) => HUES[i % HUES.length];
const app = document.getElementById("app");
let html = "";

html += `<h2>全部 ${SPECIES.length} 种 · 静态帧(网格用,40 只同屏就是这个)</h2><div class="row">` +
  SPECIES.map((sp, i) =>
    `<div class="card">${petSVG(sp, hueOf(i))}
       <div class="cap">${SPECIES_ZH[sp]} · ${sp}</div></div>`).join("") + `</div>`;

html += `<h2>动图(alive) · 只在宠物被点中放大时加载</h2>
  <p class="sub" style="margin:-4px 0 10px">同屏 40 个循环动画既吵又费电，所以网格里一律用静态帧。</p>
  <div class="row big">` +
  ["fox", "rabbit", "penguin", "unicorn", "trex"].map((sp, i) =>
    `<div class="card">${petSVG(sp, hueOf(i), { alive: true })}
       <div class="cap">${SPECIES_ZH[sp]} · 动图</div></div>`).join("") + `</div>`;

html += `<h2>三种状态 · 以狐狸为例</h2><div class="row">` +
  [["营业中", {}], ["瞌睡(未开投票)", { idle: true }], ["已提交(庆祝)", { cheer: true }]]
  .map(([cap, opt]) => `<div class="card">${petSVG("fox", 28, opt)}<div class="cap">${cap}</div></div>`).join("") + `</div>`;

html += `<h2>等级配饰 · Lv.2 星徽 / Lv.3 金冠</h2><div class="row">` +
  [["panda", 200, 1], ["panda", 200, 2], ["panda", 200, 3],
   ["unicorn", 285, 1], ["unicorn", 285, 2], ["unicorn", 285, 3]]
  .map(([sp, hue, lv]) => `<div class="card">${petSVG(sp, hue, { level: lv })}
      <div class="cap">${SPECIES_ZH[sp]} Lv.${lv}</div></div>`).join("") + `</div>`;

html += `<h2>大尺寸(132px 完成页) · 细节检查</h2><div class="row big">` +
  [["tiger", 28, { cheer: true, level: 3, alive: true }], ["owl", 45, {}],
   ["dolphin", 200, { idle: true }], ["chick", 45, { cheer: true, level: 2 }]]
  .map(([sp, hue, opt]) =>
    `<div class="card">${petSVG(sp, hue, opt)}<div class="cap">${sp} hue ${hue}</div></div>`).join("") + `</div>`;

html += `<h2 style="margin-top:28px">素材来源</h2>
  <p class="sub">Noto Animated Emoji（Google），CC BY 4.0。
  由 <code>scripts/fetch_pets.py</code> 下载并规格化，详见
  <code>/shared/pets/CREDITS.md</code>。</p>`;

app.innerHTML = html;
</script>
</body>
</html>
