<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师与账号管理 · MathMate</title>
<link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./accounts.css?v=2">
<a href="/teacher/">← 教师控制台</a><h1>教师与账号管理</h1><p id="message" role="status"></p>
<section><h2>修改我的密码</h2><p>密码至少 8 位，修改成功后需要重新登录。</p><form id="password"><label>原密码 <input type="password" name="old_password" autocomplete="current-password" required></label><label>新密码 <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>确认新密码 <input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label><button class="primary">修改密码</button></form></section>
<div id="admin" hidden><section><h2>教师列表</h2><button class="primary" id="new">新增教师</button><div style="overflow:auto"><table><thead><tr><th>姓名 / 账号</th><th>角色</th><th>状态</th><th>任教班级</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="editor" hidden><h2 id="title">新增教师</h2><form id="teacher"><label>姓名 <input name="name" required maxlength="64"></label><label>登录账号 <input name="username" required maxlength="64" pattern="[a-zA-Z0-9_.@-]+"><small> 英文字母、数字或 _.@-</small></label><label id="initial">初始密码 <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password"></label><label>角色 <select name="role"><option value="teacher">教师</option><option value="group_leader">教研组长</option><option value="school_admin">学校管理员</option></select></label><p>教师仅访问分配的班级；教研组长可查看全校班级；学校管理员维护账号与组织信息。</p><label>状态 <select name="status"><option value="active">启用</option><option value="disabled">停用</option></select></label><fieldset><legend>任教班级</legend><div id="classes"></div></fieldset><p>修改账号、角色、班级或状态后，该教师需要重新登录。</p><button class="primary">保存</button><button type="button" id="cancel">取消</button></form></section></div>
<dialog id="reset-dialog"><form id="reset"><h2>重置教师密码</h2><p id="reset-name"></p><label>新密码 <input name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><p>重置后该账号的现有登录凭据将失效。</p><button class="primary">确认重置</button><button type="button" id="reset-cancel">取消</button><p id="reset-error" role="alert"></p></form></dialog>
<script type="module" src="./accounts.js"></script></html>
